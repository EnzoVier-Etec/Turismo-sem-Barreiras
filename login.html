<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turismo sem Barreiras</title>
    <link rel="stylesheet" href="style/Login.css">
</head>

<body>

<!-- Barra superior -->
<div class="top-bar">
    <div class="top-container">

        <div class="telefone">
            <img src="assets/telefone.png" alt="Telefone">
            <span>Central 0800 123 4567</span>
        </div>

        <div class="links-topo">
            <a href="#">Seja uma agência parceira</a>
            <a href="#">Ajuda</a>
        </div>

    </div>
</div>

<!-- Cabeçalho -->
<header class="header">
    <div class="header-container">

        <div class="logo-area">

            <img src="assets/logo.png" >

            <div class="logo-text">
                <h1>Turismo <span>sem Barreiras</span></h1>
                <p>Viagens acessíveis pelo Brasil</p>
            </div>

            </div>
            <a href="login.html" class="btn-login">
                <img src="assets/perfil.png" >
                Entrar ou cadastrar
            </a>
            </div>

</header>

<!-- Menu -->
<div class="menu-container">
    <nav id="menu">

    <a href="Pacotes.html">
        <img src="assets/pacotes.png" >
        <span>Pacotes</span>
    </a>

    <a href="#">
        <img src="assets/destinos.png" >
        <span>Destinos</span>
    </a>

    <a href="Agencia.html">
        <img src="assets/agencias.png" >
        <span>Agências</span>
    </a>

    <a href="Como_funciona.html">
        <img src="assets/comofunciona.png" >
        <span>Como funciona</span>
    </a>

    <a href="Sobre_nos.html">
        <img src="assets/sobrenos.png" >
        <span>Sobre nós</span>
    </a>

    <a href="Central_ajuda.html">
        <img src="assets/centraldeajuda.png" >
        <span>Central de ajuda</span>
    </a>

    </nav>
</div>

<section class="user">

    <div class="user-box"></div>

        <div class="user-data">

        <div class="tabs">
            <button class="tab active" onclick="window.location.href='Login.html'">Entrar</button>
            <button class="tab" onclick="window.location.href='Cadastrar.html'">Cadastrar</button>
        </div>


        <h2>Entrar na sua conta</h2>
        <p>Acesse suas viagens, favoritos e reservas.</p>

        <div>
            <h3>E-mail</h3>
            <input type="email" placeholder="Digite o seu e-mail">
        </div>

        <div>
            <h3>Senha</h3>
            <input type="password" placeholder="Digite a sua senha">
        </div>

        <div class="but-entrar">
        <button onclick="window.location.href='Home.html'">Entrar</button>
        </div>

        <div class="divider">
            <span></span>
            <p>ou</p>
            <span></span>
        </div>

        <div class="but-google">  
            <button href="#">
                <img src="assets/Google.png">
                Continuar com o Google
            </button>
        </div> 

    </div>

</section>


<section class="principal">

</section>
<script src="javaScript/Login.js"></script>
</body>
</html>
